name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify compiler experiment
        run: pnpm experiment
        env:
          FARM_EXPERIMENT_SCREENSHOT: compiler-experiment.png

      - name: Upload experiment failure artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-experiment
          path: compiler-experiment.png
          if-no-files-found: ignore
          retention-days: 7
